[project]
dependencies = []
name = "S3-Kerchunk-streamer"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
boto3 = ">=1.42.0,<2"
dask = ">=2026.3.0,<2027"
distributed = ">=2026.3.0,<2027"
fsspec = ">=2026.3.0,<2027"
h5netcdf = ">=1.8.1,<2"
h5py = ">=3.16.0,<4"
hdf5plugin = ">=6.0.0,<7"
ipykernel = ">=7.2.0,<8"
kerchunk = ">=0.2.10,<1"
obspec = ">=0.1.0,<1"
obstore = ">=0.9.4,<1"
s3fs = ">=2026.3.0,<2027"
xarray = ">=2026.4.0,<2027"
zarr = ">=3.2.0,<4"
virtualizarr = ">=2.7.2,<3"
obspec_utils = ">=0.9.0,<0.10"

[tool.pixi.feature.dev.dependencies]
bokeh = ">=3.9.0,<4"
nbstripout = ">=0.9.1,<1"
pytest = ">=9.0.3,<10"
pytest-cov = ">=7.1.0,<8"
ruff = ">=0.15.15,<0.16"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "main" }
runtime = { solve-group = "main" }

[tool.pixi.feature.dev.tasks]
test = "pytest -m 'not e2e'"
"test:cov" = { cmd = "pytest -m 'not e2e' --cov=pipeline --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html" }
"test:e2e" = "pytest -m e2e"
"format:check" = "ruff format --check ."
format = "ruff format ."
lint = "ruff check ."
check = { depends-on = ["format:check", "lint", "test"] }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "e2e: end-to-end tests requiring external S3 resources",
    "integration: tests requiring external dependencies or complex setup",
]

[tool.ruff]
target-version = "py312"
extend-include = ["*.ipynb"]
extend-exclude = [
    ".pixi",
    ".venv",
    ".pytest_cache",
    "htmlcov",
    "logs",
    ".runtime_logs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "utils"]