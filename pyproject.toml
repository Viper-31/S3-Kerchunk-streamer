[project]
authors = [{name = "JohnC", email = "chewyunpin@gmail.com"}]
dependencies = []
name = "S3-Kerchunk-streamer"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]

[tool.pixi.dependencies]
boto3 = ">=1.42.0,<2"
dask = ">=2026.3.0,<2027"
distributed = ">=2026.3.0,<2027"
fsspec = ">=2026.3.0,<2027"
h5netcdf = ">=1.8.1,<2"
h5py = ">=3.16.0,<4"
hdf5plugin = ">=6.0.0,<7"
ipykernel = ">=7.2.0,<8"
kerchunk = ">=0.2.10,<1"
obspec = ">=0.1.0,<1"
obstore = ">=0.9.4,<1"
s3fs = ">=2026.3.0,<2027"
xarray = ">=2026.4.0,<2027"
zarr = ">=3.2.0,<4"
virtualizarr = ">=2.7.2,<3"

[tool.pixi.feature.dev.dependencies]
bokeh = "*"
nbstripout = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"
